services:
  core:
    build:
      context: .
      dockerfile: Dockerfile.core
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./assets:/app/assets
      - ./static:/app/static

  bot:
    build:
      context: ./bot
      dockerfile: Dockerfile
    env_file: .env
    environment:
      - BOT_TOKEN=${BOT_TOKEN}
      - GROUP_CHAT_ID=${GROUP_CHAT_ID}
      - CORE_URL=${CORE_URL:-http://core:8000}
      - PLAYERS_SHEET_CSV_URL=${PLAYERS_SHEET_CSV_URL}
      - ADMIN_USERNAMES=${ADMIN_USERNAMES}
    depends_on:
      - core
